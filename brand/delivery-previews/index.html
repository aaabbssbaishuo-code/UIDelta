<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UIDelta · 交付悬浮预览</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#f2f3ed;background:#222423;font-synthesis:none}*{box-sizing:border-box}body{margin:0;padding:48px 24px 64px}main{max-width:920px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px}header a{font-size:12px;color:#adb5a2;text-decoration:none}.brand{font-size:20px;letter-spacing:-.7px}.brand b{color:#f2603d}h1{font-size:28px;letter-spacing:-1px;margin:0 0 12px;font-weight:600}p{font-size:13px;color:#adb5a2;line-height:1.8;margin:0}.targets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin:28px 0 0;padding-bottom:190px}.target{position:relative}.trigger{width:100%;text-align:left;color:#f2f3ed;border:1px solid #41483a;border-radius:8px;background:#2e312c;padding:20px;cursor:pointer;font:inherit}.trigger:hover,.trigger:focus-visible{border-color:#f2603d;outline:none}.kind{display:inline-flex;align-items:center;justify-content:center;height:29px;min-width:39px;font:10px monospace;color:#ff977b;background:#f2603d20;border-radius:4px;margin-bottom:16px}.trigger strong{display:block;font-size:17px;font-weight:600}.trigger small{display:block;font-size:12px;color:#adb5a2;margin:7px 0 18px}.action{border:1px solid #484f40;border-radius:4px;padding:8px 10px;display:block;text-align:center;color:#c1c6b8;font-size:12px}.zip .action{background:#f2603d;border-color:#f2603d;color:#222423}.tooltip{position:absolute;top:calc(100% + 12px);left:50%;transform:translate(-50%,4px);width:270px;height:164px;visibility:hidden;opacity:0;transition:opacity .12s,transform .12s;z-index:2;filter:drop-shadow(0 8px 12px #0003)}.tooltip img{display:block;width:270px;height:164px;border-radius:10px}.target.open .tooltip{visibility:visible;opacity:1;transform:translate(-50%,0)}.target.open:after{content:"";position:absolute;height:14px;width:100%;top:100%;left:0}.downloads{border-top:1px solid #41483a;padding-top:26px}.downloads h2{font-size:16px;font-weight:500;margin:0 0 20px}.images{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}figure{margin:0}figure img{display:block;width:270px;height:164px;max-width:100%;object-fit:contain;object-position:left center}figcaption{font-size:12px;margin:14px 0 9px;color:#c1c6b8}.links{display:flex;gap:14px;flex-wrap:wrap}.links a{font-size:11px;color:#ff977b;text-underline-offset:4px}.note{font-size:11px;margin-top:24px;color:#87907e}a:focus-visible{outline:2px solid #f2603d;outline-offset:4px}
@media(max-width:760px){body{padding:26px 24px}.targets,.images{grid-template-columns:1fr;gap:22px}.targets{padding-bottom:25px}.target.open{padding-bottom:180px}.target.open .tooltip{top:calc(100% - 168px)}.tooltip{left:0;transform:translate(0,4px)}.target.open .tooltip{transform:translate(0,0)}figure img{max-width:100%;height:auto}h1{font-size:25px}.target.open:after{display:none}}
@media(prefers-reduced-motion:reduce){.tooltip{transition:none}}

:root{background:#fff;color:#202322}.brand b{color:#f2603d}header a,p,.note{color:#73796d}.trigger{background:#f5f6f3;border-color:#e2e6dc;color:#202322;border-radius:12px}.trigger small{color:#75816a}.action{color:#58694a;border-color:#dbe2d2}.kind{color:#c75332;background:#fff0e7}.downloads{border-color:#e3e7dc}.links a{color:#b94f2e}figcaption{color:#606f52}.tooltip{filter:drop-shadow(0 10px 16px #2c391e25)}
</style>
</head>
<body><main>
<header><span class="brand">UIDelta<b>.</b></span><a href="../../">返回产品页 ↗</a></header>
<h1>记录一次，接着改。</h1><p>悬停或聚焦下方卡片查看示例；手机上轻点即可。图片显示尺寸 270 × 164 px。</p>
<section class="targets" aria-label="悬浮预览演示">
  <div class="target"><button class="trigger" type="button" aria-describedby="preview-html"><span class="kind">HTML</span><strong>协作问题单</strong><small>查看与跟进</small><span class="action">预览 HTML 问题单</span></button><div class="tooltip" role="tooltip" id="preview-html"><img src="html-preview.png" srcset="html-preview@2x.png 2x" width="270" height="164" alt="HTML 示例：截图与修改要求一起看，24px 调整为 16px"></div></div>
  <div class="target"><button class="trigger" type="button" aria-describedby="preview-xlsx"><span class="kind">XLSX</span><strong>排期问题表</strong><small>表格与预览</small><span class="action">预览 XLSX 问题表</span></button><div class="tooltip" role="tooltip" id="preview-xlsx"><img src="xlsx-preview.png" srcset="xlsx-preview@2x.png 2x" width="270" height="164" alt="问题排期表：问题、优先级和处理状态"></div></div>
  <div class="target zip"><button class="trigger" type="button" aria-describedby="preview-zip"><span class="kind">ZIP</span><strong>给 Agent / 前端</strong><small>交给 Agent</small><span class="action">预览 ZIP 证据包</span></button><div class="tooltip" role="tooltip" id="preview-zip"><img src="zip-preview.png" srcset="zip-preview@2x.png 2x" width="270" height="164" alt="报告、定位与截图交给 Agent，结合项目源码辅助定位与修改"></div></div>
</section>
<section class="downloads"><h2>三张原尺寸图片</h2><div class="images">
<figure><img src="html-preview.png" srcset="html-preview@2x.png 2x" width="270" height="164" alt="HTML 协作问题单"><figcaption>01 / 协作问题单</figcaption><div class="links"><a href="html-preview.png" download>PNG</a><a href="html-preview@2x.png" download>2× 高清</a><a href="html-preview.svg" download>SVG</a></div></figure>
<figure><img src="xlsx-preview.png" srcset="xlsx-preview@2x.png 2x" width="270" height="164" alt="XLSX 排期问题表"><figcaption>02 / 排期问题表</figcaption><div class="links"><a href="xlsx-preview.png" download>PNG</a><a href="xlsx-preview@2x.png" download>2× 高清</a><a href="xlsx-preview.svg" download>SVG</a></div></figure>
<figure><img src="zip-preview.png" srcset="zip-preview@2x.png 2x" width="270" height="164" alt="ZIP 给 Agent 或前端"><figcaption>03 / 给 Agent / 前端</figcaption><div class="links"><a href="zip-preview.png" download>PNG</a><a href="zip-preview@2x.png" download>2× 高清</a><a href="zip-preview.svg" download>SVG</a></div></figure>
</div><p class="note">以上为功能示意，使用简化界面和虚构数据。</p></section>
</main><script>
for(const target of document.querySelectorAll('.target')){
  const trigger=target.querySelector('.trigger');
  target.addEventListener('pointerenter',event=>{if(event.pointerType==='mouse')target.classList.add('open')});
  target.addEventListener('pointerleave',()=>{if(!target.contains(document.activeElement))target.classList.remove('open')});
  trigger.addEventListener('focus',()=>target.classList.add('open'));
  target.addEventListener('focusout',event=>{if(!target.contains(event.relatedTarget))target.classList.remove('open')});
  trigger.addEventListener('click',()=>target.classList.add('open'));
  trigger.addEventListener('keydown',event=>{if(event.key==='Escape')target.classList.remove('open')});
}
document.addEventListener('pointerdown',event=>{for(const target of document.querySelectorAll('.target'))if(!target.contains(event.target))target.classList.remove('open')});
</script></body></html>
