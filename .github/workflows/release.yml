name: Package draft release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify tag
        run: node -e 'const m=JSON.parse(require("fs").readFileSync("extension/manifest.json")); if(process.env.GITHUB_REF_NAME!=="v"+m.version) process.exit(1)'
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.zip release/SHA256SUMS.txt --verify-tag --draft --prerelease --title "UIDelta $GITHUB_REF_NAME · Developer preview" --notes-file CHANGELOG.md
